name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/have_a_sip_e2e
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: password2026
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: have_a_sip_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 👇 Temporary debug step
      - name: Verify environment variables
        run: |
          echo "DATABASE_URL=$DATABASE_URL"
          echo "ADMIN_EMAIL=$ADMIN_EMAIL"
          echo "ADMIN_PASSWORD set: $([ -n "$ADMIN_PASSWORD" ] && echo yes || echo no)"
          echo "AUTH_SECRET set: $([ -n "$AUTH_SECRET" ] && echo yes || echo no)"
          test -f .env.e2e && echo ".env.e2e exists" || echo ".env.e2e does NOT exist"

      - name: Generate Prisma Client
        run: npm run db:generate:e2e

      - name: Run Prisma Migrations
        run: npm run db:migrate:e2e

      - name: Seed E2E Database
        run: npm run db:seed:e2e

      - name: Verify seeded admin
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -c 'SELECT email, role FROM "User";'

      

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      